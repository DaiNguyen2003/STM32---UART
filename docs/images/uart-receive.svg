<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="326" viewBox="0 0 1080 326" role="img" aria-labelledby="title desc">
  <title id="title">Luồng nhận lệnh UART</title>
  <desc id="desc">USART1: Nhận byte, Kích ngắt RX; Callback: Đưa vào hàng đợi, Bật nhận byte tiếp; Vòng lặp chính: Đọc byte, Điều khiển LED; Phản hồi: Echo và trạng thái, Gửi qua PA9</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#52657f"/>
    </marker>
    <style>
      text { font-family: 'Segoe UI', Arial, sans-serif; fill: #182c47; }
      .title { font-size: 36px; font-weight: 700; }
      .heading { font-size: 22px; font-weight: 700; }
      .label { font-size: 18px; font-weight: 700; }
      .note { font-size: 16px; fill: #435a73; }
      .edge { fill: none; stroke: #52657f; stroke-width: 2; }
    </style>
  </defs>
  <rect width="1080" height="326" rx="24" fill="#f7f9fc"/>
  <rect x="40" y="34" width="5" height="57" rx="2.5" fill="#245cae"/>
  <text class="title" x="62" y="58">Luồng nhận lệnh UART</text>
  <text class="note" x="63" y="87">115200 bit/s · 8N1 · Một byte mỗi lần nhận</text>
  <rect x="40" y="126" width="232" height="112" rx="14" fill="#eaf2ff" stroke="#bccbdd"/>
  <text class="label" x="156.0" y="157" text-anchor="middle">USART1</text>
  <text class="note" x="156.0" y="185" text-anchor="middle">Nhận byte</text>
  <text class="note" x="156.0" y="207" text-anchor="middle">Kích ngắt RX</text>
  <path class="edge" d="M272 182h20" marker-end="url(#arrow)"/>
  <rect x="296" y="126" width="232" height="112" rx="14" fill="#f0ecfb" stroke="#bccbdd"/>
  <text class="label" x="412.0" y="157" text-anchor="middle">Callback</text>
  <text class="note" x="412.0" y="185" text-anchor="middle">Đưa vào hàng đợi</text>
  <text class="note" x="412.0" y="207" text-anchor="middle">Bật nhận byte tiếp</text>
  <path class="edge" d="M528 182h20" marker-end="url(#arrow)"/>
  <rect x="552" y="126" width="232" height="112" rx="14" fill="#eaf6f2" stroke="#bccbdd"/>
  <text class="label" x="668.0" y="157" text-anchor="middle">Vòng lặp chính</text>
  <text class="note" x="668.0" y="185" text-anchor="middle">Đọc byte</text>
  <text class="note" x="668.0" y="207" text-anchor="middle">Điều khiển LED</text>
  <path class="edge" d="M784 182h20" marker-end="url(#arrow)"/>
  <rect x="808" y="126" width="232" height="112" rx="14" fill="#fff8e8" stroke="#bccbdd"/>
  <text class="label" x="924.0" y="157" text-anchor="middle">Phản hồi</text>
  <text class="note" x="924.0" y="185" text-anchor="middle">Echo và trạng thái</text>
  <text class="note" x="924.0" y="207" text-anchor="middle">Gửi qua PA9</text>
  <rect x="40" y="258" width="1000" height="42" rx="14" fill="#eaf6f2" stroke="#bccbdd"/>
  <text class="note" x="58" y="285" text-anchor="start">PC13 active-low: ký tự 1 bật LED, ký tự 0 tắt LED.</text>

</svg>
